<title>PAL Lighting — TS Quick Reference</title>
<style>
  :root{
    --navy:#0e1a2e;
    --navy-card:#152442;
    --navy-card2:#1b2d4f;
    --teal:#3dbfa0;
    --teal-dim:#2a8a72;
    --ink:#eef2f6;
    --ink-dim:#9fb0c5;
    --line:#2a3b5c;
    --warn:#e8a23d;
    --escalate:#e3556b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--navy); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto; padding:18px 16px 80px;}
  header{position:sticky; top:0; background:var(--navy); z-index:10; padding:14px 0 10px; border-bottom:1px solid var(--line);}
  h1{font-size:19px; margin:0 0 2px; letter-spacing:0.2px;}
  .sub{font-size:12.5px; color:var(--ink-dim); margin-bottom:12px;}
  #search{
    width:100%; padding:13px 14px; font-size:16px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--navy-card); color:var(--ink);
    outline:none;
  }
  #search:focus{border-color:var(--teal);}
  #competitorSelect, #productSelect{
    width:100%; padding:11px 14px; font-size:14px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--navy-card2); color:var(--ink-dim);
    outline:none; margin-top:8px; -webkit-appearance:none; appearance:none;
  }
  #competitorSelect:focus, #productSelect:focus{border-color:var(--teal); color:var(--ink);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{
    font-size:12px; padding:6px 10px; border-radius:999px; background:var(--navy-card2);
    color:var(--ink-dim); border:1px solid var(--line); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--teal); color:#06231c; border-color:var(--teal); font-weight:600;}
  .results-count{font-size:12px; color:var(--ink-dim); margin:14px 0 8px;}
  .card{
    background:var(--navy-card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head{
    padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .card-title{font-size:15.5px; font-weight:600;}
  .card-meta{font-size:11.5px; color:var(--teal); margin-top:2px; font-weight:500;}
  .caret{color:var(--ink-dim); font-size:13px; transition:transform .15s; flex-shrink:0;}
  .card.open .caret{transform:rotate(90deg);}
  .card-body{display:none; padding:0 16px 16px;}
  .card.open .card-body{display:block;}
  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--teal);
    margin:16px 0 8px; font-weight:700;
  }
  .section-label:first-child{margin-top:4px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.cause{color:var(--warn); white-space:nowrap; font-size:12.5px; padding-right:10px;}
  td.action{color:var(--ink);}
  .order-note{font-size:11.5px; color:var(--ink-dim); font-style:italic; margin:-4px 0 10px;}
  .steps{list-style:none; padding:0; margin:0; counter-reset:step;}
  .steps li{
    counter-increment:step; padding:9px 0 9px 30px; position:relative; font-size:13.5px;
    border-bottom:1px solid var(--line); line-height:1.45;
  }
  .steps li:last-child{border-bottom:none;}
  .steps li::before{
    content:counter(step); position:absolute; left:0; top:9px; width:20px; height:20px;
    background:var(--teal-dim); color:#fff; border-radius:50%; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .quote{color:var(--ink);}
  .note-box{
    background:var(--navy-card2); border-left:3px solid var(--warn); padding:10px 12px;
    border-radius:6px; font-size:13px; margin:10px 0; color:var(--ink-dim);
  }
  .escalate-box{
    background:#2a141c; border-left:3px solid var(--escalate); padding:10px 12px;
    border-radius:6px; font-size:13px; margin:10px 0; color:#f0c4cc;
  }
  .quickfacts{font-size:13px; color:var(--ink-dim); line-height:1.6; margin-top:4px;}
  .quickfacts b{color:var(--ink);}
  .no-results{text-align:center; color:var(--ink-dim); padding:40px 20px; font-size:14px;}
  .dip-table td{font-family: ui-monospace, Menlo, monospace; font-size:12.5px;}
  .product-link{
    display:block; width:100%; text-align:left; background:var(--navy-card2); border:1px solid var(--line);
    color:var(--ink); padding:11px 12px; border-radius:8px; font-size:13.5px; margin-bottom:8px; cursor:pointer;
  }
  .product-link:hover{border-color:var(--teal);}
  .product-link:last-child{margin-bottom:0;}
  .back-link{color:var(--teal); font-size:13px; cursor:pointer; margin:0 0 10px 2px; display:inline-block;}
  footer{text-align:center; font-size:11px; color:var(--ink-dim); margin-top:30px;}
  .lightbox-overlay{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(5,10,20,0.92); z-index:1000; align-items:center; justify-content:center;
    padding:20px; cursor:zoom-out;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-overlay img{
    max-width:95%; max-height:90%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  .lightbox-close{
    position:absolute; top:18px; right:22px; color:#eef2f6; font-size:32px; line-height:1;
    cursor:pointer; background:none; border:none; padding:6px 10px;
  }
  .lightbox-hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:var(--ink-dim); font-size:12px;
  }
</style>

        <li><b>New installs failing</b> → usually install/wiring error, not a defect. <b>Anything over a year old failing</b> → probably a real warranty issue.</li>
        <li><b>Always ask about recent storms.</b> Lightning/power surges fry drivers — ask early on any "stopped working" call, especially older installs.</li>
        <li><b>All lights out?</b> Manually test using the button on the driver itself before assuming wiring or head problems.</li>

    extra: `
      <div class="section-label">Step 1 — sort the symptom</div>
      <ul class="steps">
        <li>A light isn't working (dark, or a color missing)</li>
        <li>Lights are flashing</li>
      </ul>
      <div class="section-label">If a light isn't working → test on white</div>
      <ul class="steps">
        <li>White needs all 3 primaries (R/G/B) firing together — if one primary is out, white won't hold.</li>
        <li>Won't hold white on one fixture → that light has a bad primary color. Isolated.</li>
        <li>All lights hold white fine → primaries are good on every fixture. Points to the <b>driver</b> or something upstream, not the light heads.</li>
      </ul>
      <div class="section-label">If lights are flashing → suspect a short</div>
      <ul class="steps">
        <li>All lights share wiring back to the driver — a short in one light can flash the whole group.</li>
        <li>Isolate the color: test primaries individually. Ex: red won't display/flashes but blue's fine → short is in red.</li>
        <li>Isolate the fixture (multimeter): test each wire for continuity, beep = short. Pull that light, reconnect the rest — flashing stops, that's the bad one. Reintroduce the others one at a time to confirm.</li>
        <li>No multimeter: disconnect/reconnect lights one at a time, testing white each time — pulls power on all 4 wires, fastest way to find it.</li>

    facts: `<b>Part numbers:</b> 64-PAL-SRL-RGB / -RGB-120 (multi-color) &nbsp; 64-PAL-SRL-CW / -CW-120 (cool white) &nbsp; 64-PAL-SRL-WW / -WW-120 (warm white) &nbsp; Accessories: 64-PAL-SR (Sonar remote), 64-PAL-SW (Sonar Wi-Fi module, sold separately)<br>

            <b>Flag — manual's own Table of Contents doesn't match its content:</b> the install manual's ToC lists page 3 as "Nicheless Installation" and page 8 as "Troubleshooting," but neither section exists — page 3 is actually the Bulb Installation steps (this is a bulb swap, not a niche install), and page 8 is just a contact-info footer. Likely a ToC template reused from a different PAL manual and never updated. There is no troubleshooting section anywhere in this manual.<br>

    steps: [
      "<b>Steps 1–2 — remove the old bulb:</b> turn power off at the breaker, then remove the existing light fixture from the niche and place it on the pool deck (do not attempt this underwater). With the fixture out and the lens off, inspect the tensioning clip/fasteners for damage and replace if stripped, then unscrew and remove the old bulb.<br><img class=\"zoomable\" src=\"assets/image_96.jpg\" alt=\"Sonar Retro Bulb removal steps 1 and 2 diagram\" style=\"width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;\"><span style=\"display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;\">Steps 1–2 — removing the existing fixture and old bulb (tap to zoom)</span>",
      "<b>Steps 3–4 — inspect and dry the housing:</b> check the housing for damage, inspect the rubber seal where the power cord enters for leaks/deterioration, and check the lens/gasket seating surface for imperfections. Make sure the inside of the housing is completely dry before continuing.<br><img class=\"zoomable\" src=\"assets/image_97.jpg\" alt=\"Sonar Retro Bulb inspection steps 3 and 4 diagram\" style=\"width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;\"><span style=\"display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;\">Steps 3–4 — inspecting the housing and drying it out (tap to zoom)</span>",
      "<b>Steps 5–6 — install the new bulb and reseal:</b> screw the new PAL Sonar Retro Bulb into the housing. Installing a new lens gasket is highly recommended — a bad seal risks a leak and electric shock. Set the lens and cover plate on the housing and tighten evenly so the gasket seals all the way around.<br><img class=\"zoomable\" src=\"assets/image_98.jpg\" alt=\"Sonar Retro Bulb installation steps 5 and 6 diagram\" style=\"width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;\"><span style=\"display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;\">Steps 5–6 — installing the new bulb and resealing the lens (tap to zoom)</span>",

      "<b>Linking to a zone:</b> within 3 seconds of turning the light on, press the desired zone's channel button 3 times — the light flashes 3 times once linked. To unlink, press that same channel button 5 times — the light flashes 9 times to confirm.<br><img class=\"zoomable\" src=\"assets/image_95.jpg\" alt=\"Sonar remote button layout and programming reference diagram\" style=\"width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;\"><span style=\"display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;\">Sonar remote — button layout, zone linking/unlinking, and cloning channels (tap to zoom)</span>",

    facts: `<b>Part number:</b> 64-PCR-2DMX<br>
            <b>What the number means:</b> <b>2DMX</b> = 2 independently-addressable zones, controlled over a DMX512 signal instead of PAL's own remote/app<br>
            <b>What it is:</b> an outdoor-rated DMX receiver/driver for PAL 4-wire RGB LED lights, used when a home automation or show-control system needs to address the lights directly over DMX rather than through PAL's remote/Wi-Fi ecosystem.<br>
            <b>How it operates:</b> sits downstream of a separate DMX controller, not connected to a home automation system directly. <b>PAL drivers are DMX receivers, not controllers</b> — a DMX controller is required in between:<br>
            Home Automation System &rarr; DMX Controller &rarr; PAL DMX Driver<br>
            The driver reads its assigned starting channel from its own dipswitches, then maps the incoming DMX data to Red/Green/Blue output for each of its 2 zones.<br><br>
            16/35/65W versions, 24V DC output for PAL 4-wire lights &nbsp; <b>2 zones</b> (Z1 + Z2 terminal blocks)<br>
            No bonding required — Class 2 power supply, all-plastic PAL fixtures, complies with NEC article 680`,

      "Remaining bottom conduit entries: connect the 4-core wire from the PAL 4-wire lights — 2 output conduit entries are provided for up to 2 PAL-LED 4-wire lights per zone terminal block.<br><img class=\"zoomable\" src=\"assets/image_73.jpg\" alt=\"Labeled PCR-2DMX driver board diagram\" style=\"width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;\"><span style=\"display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;\">Labeled board — Manual Operation Button, Code Setting Button, DMX In/Thru/Terminate, Z1 + Z2 terminal blocks, cloning DIP table (tap to zoom)</span>",

    facts: `<b>What it is:</b> "The Attendant" is a pool automation/control platform made by Poolside Tech LLC (poolside.support) — a separate company from PAL. It controls PAL lighting over native <b>DMX512</b> addressing, not the Pentair/Hayward/Jandy protocol-cloning method used elsewhere in this guide — see the <b>Competitors</b> card for that separate path.<br><br>
            <b>Driver compatibility — confirm this first on any Attendant lighting call:</b> only PAL driver models <b>PCR-2DMX</b> and <b>PCR-3DMX</b> communicate with The Attendant. Any other PAL driver (PCR-1Z/2Z family, PCR-3D, PCR-2D, etc.) is not DMX-capable and must instead be cloned into Pentair/Hayward/Jandy protocol mode per the Competitors card — it cannot be wired to The Attendant directly.<br><br>

      <div class="section-label">Troubleshooting — check in order</div>
      <div class="order-note">The driver's "CPU" LED on the PCB doubles as the DMX signal indicator in DMX mode — lit during DMX packet transmission, flash rate depends on the DMX controller's refresh rate, and may appear solid at high refresh rates. That's expected, not a fault.</div>
      <table>
        <tr><td class="cause">No DMX signal reaching The Attendant</td><td class="action">Check connections at the green BUS terminals. Confirm the same wire colors land in the same terminal positions on both ends (e.g. blue positive on both the driver and the DMX transmitter). Confirm the driver has power. Confirm The Attendant is programmed for the correct channels.</td></tr>
        <tr><td class="cause">DMX signal present but no lights respond</td><td class="action">Verify the starting channel programmed in The Attendant matches the driver's actual DIP switch address, and that the DIP switches are set to the intended configuration per the tables below.</td></tr>
        <tr><td class="cause">Colors show but are wrong or swapped</td><td class="action">Check the channel coding in The Attendant and confirm no address numbers were skipped when mapping the driver's zones.</td></tr>
        <tr><td class="cause">Lights dim or shut off with no apparent fault</td><td class="action">Two built-in protective behaviors, not faults: loss of DMX signal holds output for 60 seconds then turns it off (fan, if fitted, follows 60 seconds after that); thermal limiting automatically reduces output above ~60&deg;C internal temperature.</td></tr>
      </table>

      <div class="section-label">DIP Switch Addressing — PCR-2DMX (Old Style)</div>
      <div class="order-note">Two switch banks (Module Config + Other Config) set the addresses for this driver's 2 zones. Dip switch positions: <b>UP is ON, DOWN is OFF.</b></div>
      <img class="zoomable" src="assets/image_118.jpg" alt="PCR-2DMX Old Style driver board with Module Config and Other Config DIP banks" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">
      <span style="display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;">Module Config + Other Config DIP banks (tap to zoom)</span>
      <div class="note-box">Two address schemas exist for this driver — <b>v1</b> and <b>v2 (12/15/2022)</b>. v2 is the current/recommended schema and is what the Basic Configuration Example below uses — confirm which schema the customer's Attendant app version expects before assuming v2 if addresses aren't lining up.</div>
      <img class="zoomable" src="assets/image_119.jpg" alt="PCR-2DMX Old Style DIP switch address table, schema v1 and v2" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">
      <span style="display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;">Module/Other Config DIP settings mapped to Zone 1/2 Red/Green/Blue addresses, both schema versions (tap to zoom)</span>

      <div class="section-label">DIP Switch Addressing — PCR-3DMX (Old Style, 8 Zone)</div>

      <div class="note-box"><b>Flag — polarity is reversed from every other driver on this page.</b> PCR-2DMX (Old Style), PCR-2DMX V3, and 64-PCR-3DMX V3 below all read UP = ON / DOWN = OFF. Only this 8-zone PCR-3DMX (Old Style) reads the opposite. Confirm the polarity legend for the specific driver in hand before setting switches — don't carry the convention over from a different model.</div>
      <img class="zoomable" src="assets/image_120.jpg" alt="PCR-3DMX Old Style 8-zone driver board with DIP switches 9-1 location" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">
      <span style="display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;">DIP switches 9-1 location on the 8-zone terminal board (tap to zoom)</span>

      <div class="order-note">DIP switches 1-9 set the addresses for this driver's 2 zones. Dip switch positions: <b>DOWN is OFF, UP is ON.</b></div>
      <img class="zoomable" src="assets/image_122.jpg" alt="PCR-2DMX V3 red driver board with DIP switch location" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">

      <img class="zoomable" src="assets/image_124.jpg" alt="64-PCR-3DMX V3 board diagram with DIP switches, Switch A, and termination shunt outlined" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">

      <span style="display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;">3-channel DIP settings mapped to Zone 1/2 Red/Green/Blue addresses (tap to zoom)</span>
      <div class="section-label">4-Channel Mode (Red, Green, Blue, White)</div>
      <div class="order-note">When using 4-Channel Mode, set Brand to Generic and Expected Colors and Shows to DMX – RGBW in The Attendant's device config.</div>
      <img class="zoomable" src="assets/image_126.jpg" alt="64-PCR-3DMX V3 4-channel DIP switch address table" style="width:100%;border-radius:8px;margin-top:8px;border:1px solid #2a3b5c;cursor:zoom-in;">

      <div class="section-label">Basic Configuration Example</div>
      <div class="order-note">Typical install: one PAL driver, two zones (pool + spa), latest driver model using schema v2 — addresses 1-6.</div>
      <ul class="steps">
        <li>Create a new light device in The Attendant app: Brand = <b>PAL</b>, Expected Colors and Shows = <b>DMX</b>, Off/On Timing = <b>DMX</b>.</li>
        <li>Port Type = <b>BUS</b>. Port Number = the BUS port the driver is wired to.</li>
        <li>Address Mapping, first zone: Red = 1, Green = 2, Blue = 3.</li>

      <div class="order-note">When more than one driver feeds additional zones, tie the drivers together using the In and Thru terminals on the communications board.</div>

      <span style="display:block;font-size:11px;color:#9fb0c5;margin-top:4px;font-style:italic;">Thru (to next driver) and In (from The Attendant) terminal blocks, with the Thru terminator jumper called out (tap to zoom)</span>
      <ul class="steps">

const root = document.getElementById('results');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const chipsEl = document.getElementById('chips');
const competitorSelect = document.getElementById('competitorSelect');
const productSelect = document.getElementById('productSelect');

const QUICK_CHIPS = ["Won't turn on","Out of sync","All lights out","Wi-Fi","DMX","Quick Ship","Escalation"];
let activeChip = null;
let directId = null;

function renderChips(){
  chipsEl.innerHTML = QUICK_CHIPS.map(c => `<span class="chip" data-c="${c}">${c}</span>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const val = el.dataset.c;
      directId = null;
      competitorSelect.value = '';
      productSelect.value = '';
      if(activeChip === val){
        activeChip = null;
        searchEl.value = '';
      } else {
        activeChip = val;
        searchEl.value = val;
      }
      render();
    });
  });
}

function issueRows(issues){
  if(!issues) return '';
  return issues.map(([cause,action]) => `<tr><td class="cause">${cause}</td><td class="action">${action}</td></tr>`).join('');
}

function cardHTML(item){
  let body = '';
  if(item.photo) body += `<img src="${item.photo}" alt="${item.photoAlt || item.title}" style="width:100%;max-width:260px;display:block;margin:0 auto 14px auto;border-radius:8px;background:#fff;padding:8px;border:1px solid #2a3b5c;">`;
  if(item.facts) body += `<div class="quickfacts">${item.facts}</div>`;
  if(item.issues){
    body += `<div class="section-label">Light Not Turning On — check in order</div>`;
    var orderNote = item.issuesNote ? item.issuesNote : 'Work down this list until one matches \u2014 it is not "check all five," it is "find the one that fits."';
    body += '<div class="order-note">' + orderNote + '</div>';
    body += `<table>${issueRows(item.issues)}</table>`;
  }
  if(item.syncIssues){
    body += `<div class="section-label">Lights Out of Sync</div>`;
    body += `<table>${issueRows(item.syncIssues)}</table>`;
  }
  if(item.steps){
    body += `<div class="section-label">Phone Walkthrough</div>`;
    body += `<ul class="steps">${item.steps.map(s => `<li>${s}</li>`).join('')}</ul>`;
  }
  if((item.videos && item.videos.length) || item.driverVideos || item.videoNote){
    body += `<div class="section-label">Reference Videos</div>`;
    if(item.videos && item.videos.length){
      body += '<ul class="steps">' + item.videos.map(v => '<li>' + v.title + ' — <a href="' + v.url + '" target="_blank" style="color:#3dbfa0;">' + v.url + '</a></li>').join('') + '</ul>';
    }
    if(item.driverVideos && item.driverVideos.length){
      body += '<div class="order-note">Driver-specific (PCR-4/PCR-2D) coding videos — relevant even without a light-specific Evenglow video:</div>';
      body += '<ul class="steps">' + item.driverVideos.map(v => '<li>' + v.title + ' — <a href="' + v.url + '" target="_blank" style="color:#3dbfa0;">' + v.url + '</a></li>').join('') + '</ul>';
    }
    if(item.videoNote){
      body += '<div class="note-box">' + item.videoNote + '</div>';
    }
  }
  if(item.note){
    body += `<div class="note-box">${item.note}</div>`;
  }
  if(item.finalImage){
    body += item.finalImage;
  }
  if(item.escalate){
    body += `<div class="escalate-box"><b>ESCALATE:</b> ${item.escalate}</div>`;
  }
  if(item.extra){
    body += item.extra;
  }
  return `
    <div class="card" data-id="${item.id}">
      <div class="card-head">
        <div>
          <div class="card-title">${item.title}</div>
        </div>
        <div class="caret">▶</div>
      </div>
      <div class="card-body">${body}</div>
    </div>
  `;
}

function matches(item, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(item.title.toLowerCase().includes(q)) return true;
  if(item.tags.some(t => t.includes(q))) return true;
  return false;
}

const HIDDEN_BY_DEFAULT = new Set(['evenglow','evenglownicheless','treomax','treoretro','treomini','aqualumin','sonarretro','evenglowfiberglass','treomicro','canadianretro','drivers','pcr2dmx','pcr3d500','pcr3dmx8z','pcr2d','pcr300','pcr4','commander2','ledoptics2','pc2t','wifi','waterblade','watersphere','ledbubbler','evenglowflex','pathwaylight','bollardlight','gardenuplight','attendant','cat-lights','cat-drivers','cat-water','cat-wifi','cat-landscape','cat-automation']);

function render(){
  const q = searchEl.value.trim();
  let filtered;
  if(directId){
    filtered = DATA.filter(item => item.id === directId);
  } else if(q){
    filtered = DATA.filter(item => matches(item, q));
  } else {
    filtered = DATA.filter(item => !HIDDEN_BY_DEFAULT.has(item.id));
  }
  countEl.textContent = directId ? `Jumped to "${filtered[0] ? filtered[0].title : ''}"` : (q ? `${filtered.length} result${filtered.length===1?'':'s'} for "${q}"` : `${filtered.length} entries`);
  chipsEl.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', el.dataset.c === activeChip);
  });
  if(filtered.length === 0){
    root.innerHTML = `<div class="no-results">No matches. Try a product name, SKU, or symptom like "won't turn on."</div>`;
    return;
  }
  let backHTML = '';
  if(directId === 'products'){
    backHTML = `<div class="back-link" onclick="jumpToProduct('')">&larr; Back to Home</div>`;
  } else if(directId && HIDDEN_BY_DEFAULT.has(directId)){
    const currentItem = filtered[0];
    const backTarget = (currentItem && currentItem.backTo) ? currentItem.backTo : 'products';
    const targetItem = DATA.find(d => d.id === backTarget);
    const backLabel = targetItem ? targetItem.title : 'Products';
    backHTML = `<div class="back-link" onclick="jumpToProduct('${backTarget}')">&larr; Back to ${backLabel}</div>`;
  }
  root.innerHTML = backHTML + filtered.map(cardHTML).join('');
  root.querySelectorAll('.card-head').forEach(head => {
    head.addEventListener('click', () => {
      head.parentElement.classList.toggle('open');
    });
  });
  // auto-open if single result from a search or a direct product/products jump
  if((q || directId) && filtered.length === 1){
    root.querySelector('.card').classList.add('open');
  }
}

window.jumpToProduct = function(id){
  activeChip = null;
  competitorSelect.value = '';
  productSelect.value = '';
  searchEl.value = '';
  directId = id || null;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
};

searchEl.addEventListener('input', () => { activeChip = null; directId = null; competitorSelect.value = ''; productSelect.value = ''; render(); });

competitorSelect.addEventListener('change', () => {
  activeChip = null;
  directId = null;
  productSelect.value = '';
  searchEl.value = competitorSelect.value ? competitorSelect.value : '';
  render();
});

productSelect.addEventListener('change', () => {
  activeChip = null;
  competitorSelect.value = '';
  searchEl.value = '';
  directId = productSelect.value || null;
  render();
});

// Lightbox: event delegation since cards/images are injected dynamically
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

document.addEventListener('click', (e) => {
  if(e.target.classList && e.target.classList.contains('zoomable')){
    lightboxImg.src = e.target.src;
    lightboxImg.alt = e.target.alt;
    lightbox.classList.add('open');
  }
});
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

renderChips();
render();
</script>
</body>
</html>
